name: Build and Deploy pogos-frontend

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: true

env:
  IMAGE_CORE: ghcr.io/${{ github.repository_owner }}/pogos-frontend

jobs:
  build:
    name: Build Angular App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Angular app
        run: npm run build --prod

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v3
        with:
          name: frontend-dist
          path: dist/

  dockerize:
    name: Dockerize and Push
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download frontend dist
        uses: actions/download-artifact@v3
        with:
          name: frontend-dist
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pogos-frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile_core
          tags: |
            ${{ env.IMAGE_CORE }}:${{ github.event.inputs.tag }}
            ${{ env.IMAGE_CORE }}:${{ github.sha }}
            ${{ env.IMAGE_CORE }}:latest
          push: true
          build-args: |
            APP_NAME=pogos-core
