<div id="game-table">
  <!-- Coin supérieur gauche - Coeur -->
  <div class="symbol-top-left">
    <div class="icon">
      <img ngSrc="/assets/icons/coeur.png" alt="coeur" height="1024" width="1024" />
    </div>
  </div>

  <!-- Coin supérieur droit - Pique -->
  <div class="symbol-top-right">
    <div class="icon">
      <img ngSrc="/assets/icons/pique.png" alt="pique" height="512" width="512" />
    </div>
  </div>

  <!-- Coin inférieur gauche - Trèfle -->
  <div class="symbol-bottom-left">
    <div class="icon">
      <img ngSrc="/assets/icons/trefle.png" alt="trefle" height="800" width="900" />
    </div>
  </div>

  <!-- Coin inférieur droit - Carreau -->
  <div class="symbol-bottom-right">
    <div class="icon">
      <img ngSrc="/assets/icons/carreau.png" alt="carreau" height="410" width="410" />
    </div>
  </div>

  @if (gameDeck) {
  <div class="card-container">
    <div class="dealer-container">
      <app-card-hand class="player-slot" [handName]="'dealer'" [cards]="hands.dealerHand"
        [currentUser]="false"></app-card-hand>
    </div>

    <div class="player-hands-container">
      <!-- Texte "Blackjack Pay 3 to 2" en courbe -->
      <div class="blackjack-curved-text">
        <svg viewBox="0 0 400 100">
          <defs>
            <path id="curve" d="M 50 15 Q 200 150 350 15" />
          </defs>
          <text>
            <textPath href="#curve" startOffset="50%">
              BLACKJACK PAYS 3 TO 2
            </textPath>
          </text>
        </svg>
      </div>

      <!-- Ligne 1 (plus haute) -->
      <div class="player-slot slot-1"></div>
      <div class="player-slot slot-6"></div>

      <div cdkDropList [cdkDropListData]="slot1" class="drop-zone" (cdkDropListDropped)="onDrop($event)">
        <div *ngFor="let token of slot1" cdkDrag class="token">
          <img src="assets/chips/1_chip.png" alt="chip" height="35" width="35" />
        </div>
      </div>

      <div cdkDropList [cdkDropListData]="slot2" class="drop-zone" (cdkDropListDropped)="onDrop($event)">
        <div *ngFor="let token of slot2" cdkDrag class="token">
          <img src="assets/chips/1_chip.png" alt="chip" height="35" width="35" />
        </div>
      </div>

      <!-- Ligne 2 (milieu) -->
      <div class="player-slot slot-2"></div>
      <div class="player-slot slot-5"></div>

      <!-- Ligne 3 (bas) -->
      <app-card-hand class="player-slot slot-3" [handName]="'3'" [cards]="hands.selfHand"
        [currentUser]="false"></app-card-hand>
      <div class="player-slot slot-4"></div>
    </div>

  </div>
  }
</div>
