<nz-modal [(nzVisible)]="isVisible" [nzTitle]="title" [nzOkText]="okText" [nzCancelText]="cancelText"
  nzClassName="custom-modal" [nzClosable]="false" (nzOnOk)="handleOk()" (nzOnCancel)="handleCancel()">
  <ng-container *nzModalContent>
    <div class="modal-body">
      <p><strong>ID de la partie :</strong> {{ gameId }}</p>

      <p><strong>Joueurs :</strong></p>
      <ul>
        @for (player of players(); track $index){
        <li>{{ player }}</li>
        }
      </ul>
    </div>
    {{errorMessage()}}
  </ng-container>
</nz-modal>
