<div id="game-selector">

  <div id="back-image">
    <img src="/assets/pogos-logo.webp" id="image" alt="pogos-logo" />
  </div>

  <div id="game-buttons">
    @for(game of games; track game){
      <app-pogos-button style="width: 100%;" [title]="game" (clicked)="emitGameName(game)"></app-pogos-button>
    }
  </div>

</div>
