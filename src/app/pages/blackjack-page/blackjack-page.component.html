<app-header [title]="'Blackjack'" [canLeave]="true" [leaveSignal]="isLeaveModalVisible"></app-header>
<div class="main-content">

  <div class="game-content">
    <div>
      <div class="game-content-table">
        <app-game-table [hands]="hands"></app-game-table>
      </div>

      <action-row [actions]="actions" [isActionsDisabled]="isActionDisabled" [secondaryActions]="secondaryActions"
        [isSecondaryActionsDisabled]="isActionDisabled" [playerBalance]="playerBalance" [playerBet]="playerBet" [gameMode]="gameMode"
        (openChat)="open()" (executeAction)="executeAction($event)" />
      @if(gameService.gameMode === GameMode.MULTIPLAYER) {
        <nz-divider  nzPlain nzType="vertical"></nz-divider>
        <app-chat [gameService]="gameService"></app-chat>
      }
    </div>


    <nz-modal [nzVisible]="isLeaveModalVisible()" nzTitle="Déconnexion" nzCentered (nzOnCancel)="handleCancelMiddle()"
      (nzOnOk)="handleOkMiddle()">
      <ng-container *nzModalContent>
        <p>Est-tu sûr de vouloir quitter la partie ?</p>
      </ng-container>
    </nz-modal>

    <app-waiting-room-modal [isVisible]="isWaitingRoomModalVisible" [errorMessage]="errorWaitingRoom" [title]="'Rejouer la partie'" [okText]="'Relancer'"
      [cancelText]="'Quitter'" [gameId]="gameId" [players]="players" [initialBet]="playerBet"
      (onOk)="handleWaitingRoomConfirmClick($event)" (onCancel)="handleWaitingRoomLeave()" (changePrivacy)="changePrivacy()"></app-waiting-room-modal>

  </div>

</div>
