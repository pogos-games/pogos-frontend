<app-header [canLeave]="true" [leaveLink]="'/games'" [title]="'Profil'"></app-header>
<div class="main-content">

  <div class="profile">

    <div class="profile-actions-selector">

      <img ngSrc="assets/pogos-logo.webp" alt="pogos-logo" height="150" width="150">

      <span class="luckiest-guy-regular">{{user.pseudo}}</span>

      <app-pogos-button [title]="'Préférences'"  routerLink="/profile/preferences"></app-pogos-button>

      <app-pogos-button [title]="'Copains'" routerLink="/profile/friends"></app-pogos-button>

      <app-pogos-button [title]="'Parties'" routerLink="/profile/game-history"></app-pogos-button>

    </div>

    <div class="profile-actions">
      <router-outlet></router-outlet>
    </div>

  </div>

</div>
