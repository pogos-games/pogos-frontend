<app-header [title]="'Uno'" [canLeave]="true" [leaveLink]="'/games'"></app-header>
<div class="main-content">

  <div class="game-content">
    <app-uno-table></app-uno-table>
    @if(gameService.gameType === GameType.MULTIPLAYER) {
      <nz-divider  nzPlain nzType="vertical"></nz-divider>
      <app-chat ></app-chat>
    }

  </div>

</div>

<app-modal [title]="'Fin de Partie'" [description]="gameService.unoGameState().gameWinner + ' à gagné la partie !'"
                      [okText]="'Relancer'" [cancelText]="'Quitter'"
                      [isVisible]="gameService.isGameEnded">
</app-modal>
