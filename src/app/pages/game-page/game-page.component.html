<app-header [canLeave]="false" [title]="'Pogos'"></app-header>

<div class="main-content">
  <div id="actions">

    <div id="game-selector">

      <img ngSrc="assets/pogos-logo.webp" alt="pogos-logo" height="150" width="150">

      <app-pogos-button (click)="onTitleChange('BlackJack')" [title]="'BlackJack'"></app-pogos-button>
      <app-pogos-button (click)="onTitleChange('Uno')" [title]="'Uno'" [disabled]="true"></app-pogos-button>
      <app-pogos-button (click)="onTitleChange('Tarot')" [title]="'Tarot'" [disabled]="true"></app-pogos-button>
      <app-pogos-button (click)="onTitleChange('Poker')" [title]="'Poker'" [disabled]="true"></app-pogos-button>

    </div>

    <div id="game-actions">

      <div id="top-buttons">
        <button nz-button class="main-button luckiest-guy-regular" [routerLink]="['/games', title.toLowerCase()]"
          [queryParams]="{ gameType: 'solo' }">Jouer en solo</button>
        <button nz-button class="main-button luckiest-guy-regular" [routerLink]="['/games', title.toLowerCase()]"
          [queryParams]="{ gameType: 'multi' }">Jouer en multijoueur</button>
      </div>

      <div id="bottom-button">
        <button nz-button class="main-button luckiest-guy-regular">Créer une partie privée</button>
      </div>

    </div>

    <app-ranking></app-ranking>

  </div>


</div>
